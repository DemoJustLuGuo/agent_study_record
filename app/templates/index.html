<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Web App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>RAG Agent</h1>
            <p>轻量 Flask 前端，支持流式响应</p>
        </header>

        <section id="chat" class="chat" aria-live="polite"></section>

        <form id="chat-form" class="composer">
            <textarea id="prompt" rows="3" placeholder="请输入您的问题..." required></textarea>
            <button id="send-btn" type="submit">发送</button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
