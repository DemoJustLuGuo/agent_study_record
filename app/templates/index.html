<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Web App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>RAG Agent</h1>
            <p>轻量 Flask 前端，支持流式响应</p>
        </header>

        <section class="uploader">
            <h2>知识库更新(测试功能)</h2>
            <form id="upload-form" class="upload-form">
                <input id="upload-file" type="file" accept=".txt" required />
                <button id="upload-btn" type="submit">上传到知识库</button>
            </form>
            <p id="upload-result" class="upload-result"></p>
        </section>

        <section id="chat" class="chat" aria-live="polite"></section>

        <form id="chat-form" class="composer">
            <label class="mode-switch" for="rag-mode">
                <input id="rag-mode" type="checkbox" />
                在线RAG直答（检索知识库后回答，测试功能）
            </label>
            <textarea id="prompt" rows="3" placeholder="请输入您的问题..." required></textarea>
            <button id="send-btn" type="submit">发送</button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
