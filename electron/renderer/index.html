<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Studio Desktop</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>Agent Studio Desktop</h1>
        <p class="subtitle">Electron 前端 | 本地 Flask API 服务</p>
      </div>
      <div class="status-wrap">
        <span id="backend-status" class="status-badge pending">后端状态: 初始化中</span>
        <span id="backend-url" class="backend-url"></span>
      </div>
    </header>

    <section class="panel connection-panel">
      <div class="connection-head">
        <h2>连接设置</h2>
        <p class="connection-subtitle">API 地址与密钥会保存在本地前端，下次打开可直接复用。</p>
      </div>

      <div class="connection-grid">
        <label for="api-url-input">API 地址</label>
        <input
          id="api-url-input"
          type="text"
          placeholder="http://127.0.0.1:7860"
          autocomplete="off"
        />

        <label for="api-key-input">API 密钥</label>
        <input
          id="api-key-input"
          type="password"
          placeholder="sk-..."
          autocomplete="off"
        />

        <label for="show-api-key" class="inline-toggle">
          <input id="show-api-key" type="checkbox" />
          显示密钥
        </label>
      </div>

      <div class="connection-actions">
        <button id="save-conn-btn" type="button">保存并连接</button>
        <button id="clear-conn-btn" type="button" class="btn-secondary">清空设置</button>
        <span id="conn-hint" class="conn-hint" aria-live="polite"></span>
      </div>
    </section>

    <section class="panel chat-panel">
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="chat-form" class="composer">
        <textarea id="prompt" rows="4" placeholder="请输入您的问题..." required></textarea>
        <div class="composer-actions">
          <button id="send-btn" type="submit">发送</button>
          <button id="stop-btn" type="button" disabled>停止</button>
        </div>
      </form>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
